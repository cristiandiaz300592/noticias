name: Actualizar noticias

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Probar sistema
        run: |
          echo "Sistema de noticias funcionando"
          date
